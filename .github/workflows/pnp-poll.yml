# Fork-only helper: asks the desk for a step every 2 minutes; when one is handed out, saves it to branch pnp-step and renews its lease until the job ends.
name: pnp-poll
on:
  push:
    branches: [pnp-scratch]
    paths: [scratch/POLL]
permissions:
  contents: write
concurrency:
  group: pnp-poll
  cancel-in-progress: true
jobs:
  poll:
    if: github.repository == 'mt211211/pequalnp-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          DESK=https://pequalnp.com/desk
          mkdir -p step; lease=""
          for i in $(seq 1 170); do
            if [ -z "$lease" ]; then
              curl -sS "$DESK/next?handle=mt211211" -o step/next.json
              lease=$(python3 -c "import json; d=json.load(open('step/next.json')); print((d.get('lease') or {}).get('id','') if d.get('gap') else '')")
              if [ -n "$lease" ]; then
                date -u > step/when.txt
                git config user.name pnp-bot; git config user.email pnp-bot@users.noreply.github.com
                git checkout -B pnp-step; git add -f step; git commit -qm "step $(date -u +%T)"; git push -qf origin pnp-step
                echo "took lease $lease"
              fi
            else
              code=$(curl -sS -o resp -w '%{http_code}' -X POST "$DESK/beat?lease=$lease"); echo "$(date -u +%T) beat $code"
              [ "$code" = 200 ] || lease=""
            fi
            sleep 120
          done
