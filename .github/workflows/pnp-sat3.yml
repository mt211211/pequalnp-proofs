# Fork-only helper: a second SAT job, run beside pnp-scratch; commits its output to branch pnp-sat3.
name: pnp-sat3
on:
  push:
    branches: [pnp-scratch]
    paths: [scratch/SAT3]
permissions:
  contents: write
concurrency:
  group: pnp-sat3
  cancel-in-progress: true
jobs:
  run:
    if: github.repository == 'mt211211/pequalnp-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: job
        run: |
          set +e
          mkdir -p out3
          timeout 280m bash scratch/sat3.sh > out3/log.txt 2>&1
          echo "exit $?" >> out3/log.txt
      - name: commit results
        if: always()
        run: |
          git config user.name pnp-bot; git config user.email pnp-bot@users.noreply.github.com
          git checkout -B pnp-sat3
          git add -f out3
          git commit -qm "sat2 $GITHUB_RUN_ID"
          git push -f origin pnp-sat3
